<script>
function playBell(){
  const audio = document.getElementById("bellAudio");
  if(!audio) return;
  try{
    audio.currentTime = 0;
    audio.play().catch(()=>{});
  }catch(e){
    console.error(e);
  }
}

/* --- MODALITÀ TEST SEGRETA (funziona su Mac) --- */
let testMode = false;
let testDay = 1;

document.addEventListener("keydown", (e) => {
  // Funziona sempre: intercetta il tasto T in qualsiasi layout
  if (e.code === "KeyT" && e.shiftKey) {
    testMode = !testMode;

    if (testMode) {
      const input = prompt(
        "Modalità test ATTIVA! Inserisci un giorno da simulare (1-24):",
        "8"
      );
      const parsed = parseInt(input, 10);
      if (!isNaN(parsed) && parsed >= 1 && parsed <= 24) {
        testDay = parsed;
        alert("Modalità test attiva! Scarlett può aprire fino al giorno " + testDay + ".");
      } else {
        testDay = 1;
        alert("Valore non valido. La modalità test userà giorno = 1.");
      }
    } else {
      alert("Modalità test DISATTIVATA. Torna al comportamento normale.");
    }
  }
});
/* ------------------------------------------------ */

/* ⏱️ FUNZIONE CHE DECIDE SE UNA CASELLA SI PUÒ APRIRE */
function canOpenDoor(dayNumber){
  const now = new Date();
  const month = now.getMonth(); // 0 = gennaio, 11 = dicembre
  const day = now.getDate();

  // Se modalità test attiva, usa il giorno fittizio
  if (testMode) {
    return dayNumber <= testDay;
  }

  // Se NON siamo a dicembre → nessun blocco (così puoi testare in anticipo)
  if (month !== 11) return true;

  // A dicembre puoi aprire solo le caselle <= giorno corrente
  return dayNumber <= day;
}

const TOTAL_DAYS = 24;

// ✅ UNICA dichiarazione di mediaFiles
const mediaFiles = [
  "image/1.jpg",
  "image/2.jpg",
  "image/3.jpg",
  "image/4.jpg",
  "image/5.jpg",
  "image/6.jpg",
  "image/7.jpg",
  "image/8.jpg",
  "image/9.jpg",
  "image/10.jpg",
  "image/11.jpg",
  "image/12.jpg",
  "image/13.jpg",
  "image/14.jpg",
  "image/15.jpg",
  "image/16.jpg",
  "image/17.jpg",
  "image/18.jpg",
  "image/19.jpg",
  "image/20.jpg",
  "image/21.jpg",
  "image/22.mov",  // unico video
  "image/23.jpg",
  "image/24.jpg"
];

const cal = document.getElementById("calendar");

// numeri random
const days = Array.from({length: TOTAL_DAYS}, (_, i) => i + 1);
for (let i = days.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [days[i], days[j]] = [days[j], days[i]];
}

days.forEach(d => {
  const div = document.createElement("div");
  div.className = "door";
  div.dataset.day = d;

  const filename = mediaFiles[d - 1];
  const isVideo = /\.(mp4|mov|webm|ogg)$/i.test(filename);

  div.innerHTML = `
    <div class="door-label">${d}</div>
    ${
      isVideo
        ? `<video src="${filename}" muted loop playsinline></video>`
        : `<img src="${filename}" alt="Day ${d}">`
    }
  `;
  cal.appendChild(div);
});

document.querySelectorAll(".door").forEach(door=>{
  const day = parseInt(door.dataset.day,10);
  const key = "advent-door-"+day;

  if(localStorage.getItem(key)==="true"){
    door.classList.add("open");
  }

  door.addEventListener("click",()=>{
    // controllo data
    if (!canOpenDoor(day)) {
      alert(`Furbetta!!! Puoi aprire questa casella solo dal giorno ${day} dicembre 🎄`);
      return;
    }

    if(door.classList.contains("open")) return;
    door.classList.add("open");
    localStorage.setItem(key,"true");
    playBell();
  });
});

// RESET
document.getElementById("resetBtn").addEventListener("click", ()=>{
  document.querySelectorAll(".door").forEach(door=>{
    door.classList.remove("open");
  });
  for(let d=1;d<=TOTAL_DAYS;d++){
    localStorage.removeItem("advent-door-"+d);
  }
});
</script>
