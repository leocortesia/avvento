<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Calendario dell'Avvento di Scarlett</title>

<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0;}

html,body{height:100%;}

body{
  margin:0;
  padding:20px;
  font-family:"Nunito",system-ui,sans-serif;
  color:white;
  text-align:center;
  min-height:100vh;
  overflow-x:hidden;

  background-color:#000;
  background-image:url("sfondo-natale.jpg");
  background-size:cover;
  background-repeat:no-repeat;
  background-position:center center;
  background-attachment:fixed;
  position:relative;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(circle at top,rgba(0,0,0,0.05),rgba(0,0,0,0.65));
  z-index:0;
}

/* NEVE ANIMATA */
.snow-layer{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
}
.snowflake{
  position:absolute;
  top:-10vh;
  color:rgba(255,255,255,0.9);
  font-size:1.1rem;
  animation:fall linear infinite;
}
@keyframes fall{
  0%{transform:translateY(-10vh);opacity:0;}
  15%{opacity:1;}
  100%{transform:translateY(110vh);opacity:0;}
}

/* TITOLO */
h1{
  font-family:"Mountains of Christmas",cursive;
  font-size:3rem;
  margin:10px 0 4px;
  letter-spacing:.05em;
  text-shadow:0 4px 10px rgba(0,0,0,.9);
  position:relative;
  z-index:2;
}
.subtitle{
  opacity:.9;
  margin-bottom:16px;
  position:relative;
  z-index:2;
}

/* CONTENITORE */
.calendar-wrapper{
  margin:0 auto;
  margin-top:10px;
  padding:20px 18px 24px;
  max-width:760px;
  background:rgba(4,17,40,0.92);
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.16);
  box-shadow:0 10px 25px rgba(0,0,0,.7);
  backdrop-filter:blur(6px);
  position:relative;
  z-index:2;
}

/* BOTTONE RESET */
.reset-btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin:0 auto 16px;
  padding:8px 18px;
  border-radius:999px;
  border:none;
  font-family:"Nunito",system-ui,sans-serif;
  font-weight:700;
  font-size:0.95rem;
  cursor:pointer;
  background:linear-gradient(135deg,#f1c40f,#e67e22);
  color:#2c3e50;
  box-shadow:0 3px 8px rgba(0,0,0,.4);
  transition:transform .12s,box-shadow .12s,filter .2s;
}
.reset-btn:hover{
  transform:translateY(-1px);
  box-shadow:0 5px 12px rgba(0,0,0,.6);
  filter:brightness(1.05);
}
.reset-btn:active{
  transform:translateY(0);
  box-shadow:0 2px 6px rgba(0,0,0,.5);
}

/* GRIGLIA */
.calendar{
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:12px;
}

/* CASELLE */
.door{
  border-radius:12px;
  box-shadow:0 4px 12px rgba(0,0,0,.6);
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:transform .15s,box-shadow .15s,filter .2s;
  background-image:
    linear-gradient(150deg,rgba(255,255,255,.22),transparent 40%),
    linear-gradient(135deg,#d63031,#c0392b);
}
.door:nth-child(3n){
  background-image:
    linear-gradient(150deg,rgba(255,255,255,.22),transparent 40%),
    linear-gradient(135deg,#16a085,#0e6655);
}
.door:nth-child(4n){
  background-image:
    linear-gradient(150deg,rgba(255,255,255,.22),transparent 40%),
    linear-gradient(135deg,#e67e22,#d35400);
}
.door:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 18px rgba(0,0,0,.75);
  filter:brightness(1.06);
}

/* NUMERO */
.door-label{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Mountains of Christmas",cursive;
  font-size:2rem;
  font-weight:700;
  text-shadow:0 2px 6px rgba(0,0,0,.8);
  z-index:2;
}
.door-label::before{
  content:"";
  position:absolute;
  inset:12%;
  border-radius:10px;
  border:2px dashed rgba(255,255,255,0.8);
}

/* IMMAGINE DIETRO AL NUMERO */
.door img{
  width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .35s;
}
.door.open img{opacity:1;}
.door.open .door-label{opacity:0;transition:opacity .25s;}

.footer-note{
  margin-top:10px;
  font-size:.85rem;
  opacity:.85;
}

/* RESPONSIVE */
@media(max-width:700px){
  h1{font-size:2.4rem;}
  .calendar{grid-template-columns:repeat(4,1fr);}
}
</style>
</head>

<body>

<audio id="bellAudio" src="campanelle.mp3" preload="auto"></audio>

<!-- NEVE -->
<div class="snow-layer">
  <span class="snowflake" style="left:5%;animation-duration:13s;animation-delay:0s;">❄</span>
  <span class="snowflake" style="left:18%;animation-duration:10s;animation-delay:2s;">✻</span>
  <span class="snowflake" style="left:32%;animation-duration:15s;animation-delay:1s;">❅</span>
  <span class="snowflake" style="left:50%;animation-duration:11s;animation-delay:3s;">✼</span>
  <span class="snowflake" style="left:66%;animation-duration:14s;animation-delay:0.5s;">❄</span>
  <span class="snowflake" style="left:80%;animation-duration:12s;animation-delay:4s;">✻</span>
  <span class="snowflake" style="left:90%;animation-duration:9s;animation-delay:1.5s;">❅</span>
</div>

<h1>Calendario dell'Avvento di Scarlett</h1>
<p class="subtitle">Apri una casella ogni giorno e scopri una sorpresa ✨</p>

<div class="calendar-wrapper">
  <button id="resetBtn" class="reset-btn">🔄 Reset caselle</button>
  <div id="calendar" class="calendar"></div>
  <p class="footer-note">Le caselle aperte rimangono aperte anche se ricarichi la pagina 💌</p>
</div>

<script>
function playBell(){
  const audio = document.getElementById("bellAudio");
  if(!audio) return;
  try{
    audio.currentTime = 0;
    audio.play().catch(()=>{});
  }catch(e){
    console.error(e);
  }
}

/* ⏱️ FUNZIONE CHE DECIDE SE UNA CASELLA SI PUÒ APRIRE */
function canOpenDoor(dayNumber){
  const now = new Date();
  const month = now.getMonth();   // 0 = gennaio, 11 = dicembre
  const day = now.getDate();

  // Se NON siamo a dicembre → nessun blocco (così puoi testare tutto)
  if (month !== 11) return true;

  // A dicembre puoi aprire solo le caselle <= giorno corrente
  return dayNumber <= day;
}

const TOTAL_DAYS = 24;
const images = [];
for(let i=1;i<=TOTAL_DAYS;i++){
  images.push("https://picsum.photos/400?random="+i);
}

const cal = document.getElementById("calendar");

// numeri random
const days = Array.from({length:TOTAL_DAYS},(_,i)=>i+1);
for(let i=days.length-1;i>0;i--){
  const j = Math.floor(Math.random()*(i+1));
  [days[i],days[j]] = [days[j],days[i]];
}

days.forEach(d=>{
  const div = document.createElement("div");
  div.className = "door";
  div.dataset.day = d;
  div.innerHTML = `
    <div class="door-label">${d}</div>
    <img src="${images[d-1]}" alt="Day ${d}">
  `;
  cal.appendChild(div);
});

document.querySelectorAll(".door").forEach(door=>{
  const day = parseInt(door.dataset.day,10);
  const key = "advent-door-"+day;

  if(localStorage.getItem(key)==="true"){
    door.classList.add("open");
  }

  door.addEventListener("click",()=>{
    // controllo data
    if (!canOpenDoor(day)) {
      alert(`Puoi aprire questa casella solo dal ${day} dicembre 🎄`);
      return;
    }

    if(door.classList.contains("open")) return;
    door.classList.add("open");
    localStorage.setItem(key,"true");
    playBell();
  });
});

document.getElementById("resetBtn").addEventListener("click", ()=>{
  document.querySelectorAll(".door").forEach(door=>{
    door.classList.remove("open");
  });
  for(let d=1;d<=TOTAL_DAYS;d++){
    localStorage.removeItem("advent-door-"+d);
  }
});
</script>

</body>
</html>
